name: Publish

on:
  push:
    tags:
      - "v*"
      - "*@*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release 作成用
  id-token: write # npm OIDC Trusted Publishing & Provenance 署名用

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (with npm registry for OIDC)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Run checks and tests
        run: |
          vp check
          vp run -r test

      - name: Build packages
        run: vp run -r build

      - name: Publish packages to npm (OIDC Trusted Publishing)
        run: vp node scripts/publish.mjs
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
